<!--
  The same mark, full bleed, for iOS.

  Safari composites an apple-touch-icon onto BLACK — transparency is not
  honoured — and then applies its own corner radius. A rounded source would
  therefore show a black sliver inside iOS's own rounding, which is why this
  variant exists rather than reusing `icon.svg`.

  The bars keep their original proportion (112 of 192, so ~58% of the width);
  iOS's mask is mild and does not need the maskable variant's safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#2563eb" />
  <rect x="40" y="44" width="112" height="20" rx="6" fill="#ffffff" />
  <rect x="40" y="86" width="112" height="20" rx="6" fill="#ffffff" opacity="0.75" />
  <rect x="40" y="128" width="68" height="20" rx="6" fill="#ffffff" opacity="0.5" />
</svg>
