<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <script>
      // Applies the stored theme before first paint. Without this the page
      // renders light for a frame and then flips, which on a phone at night
      // is a flash in the face. Deliberately inline, tiny, and defensive: a
      // browser with site data blocked throws on localStorage, and a theme is
      // never worth failing to render over.
      (function () {
        try {
          var stored = localStorage.getItem("profs-theme") || "system";
          var dark =
            stored === "ardoise" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "ardoise" : "copie");
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="<%= basePath %>manifest.json" />
    <link rel="icon" href="<%= basePath %>icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="<%= basePath %>icons/icon-192.svg" />
    <title>profs</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Recovery: if the app JS fails to load (stale SW serving old assets),
      // unregister SW, clear caches, and reload once.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && root.children.length === 0 && "serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            var tasks = regs.map(function (r) { return r.unregister(); });
            if (caches && caches.keys) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
            Promise.all(tasks).then(function () {
              if (!sessionStorage.getItem("sw-recovery")) {
                sessionStorage.setItem("sw-recovery", "1");
                location.reload();
              }
            });
          });
        }
      }, 3000);
    </script>
  </body>
</html>
